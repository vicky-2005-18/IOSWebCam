<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS WebCam Bridge</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        #video-preview {
            width: 100%;
            max-width: 1280px;
            min-height: 260px;
            height: auto;
            background: #111;
            border-radius: 10px;
            border: 2px solid #333;
            display: block;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="connection-status" class="status disconnected">Disconnected</div>
        <div class="frame-counter">Frames: 0</div>
        <div id="error-message">
            <div id="error-text"></div>
            <button id="retry-button">Retry</button>
        </div>
        <div id="info-message" style="display: none;"></div>

        <!-- Big Start Streaming button for mobile tap permissions -->
        <button id="start-btn" onclick="startCamera()" style="display: block; width: 100%; padding: 18px; font-size: 18px; font-weight: bold; background: #28a745; color: #fff; border: none; border-radius: 10px; margin-bottom: 15px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); -webkit-tap-highlight-color: transparent;">
            ▶ Start Camera & Stream
        </button>

        <div id="debug-log" style="font-family: monospace; font-size: 13px; color: #ffeb3b; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 6px; margin-bottom: 10px; display: none;"></div>

        <!-- Control Panel -->
        <div id="control-panel" style="display: none; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px; margin-bottom: 15px;">
            <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
                <button id="camera-toggle" style="flex: 1; min-width: 120px; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;">
                    📷 Switch Camera
                </button>
                <button id="torch-toggle" style="flex: 1; min-width: 120px; padding: 12px; background: #FF9800; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; disabled: true;">
                    🔦 Flashlight
                </button>
                <button id="mirror-toggle" style="flex: 1; min-width: 120px; padding: 12px; background: #9C27B0; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;">
                    🪞 Flip / Mirror
                </button>
                <select id="fps-selector" style="flex: 1; min-width: 100px; padding: 12px; background: #E91E63; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;">
                    <option value="30">30 FPS</option>
                    <option value="60" selected>60 FPS</option>
                </select>
                <select id="resolution-selector" style="flex: 1; min-width: 110px; padding: 12px; background: #2196F3; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;">
                    <option value="480">480p</option>
                    <option value="720" selected>720p</option>
                    <option value="1080">1080p</option>
                </select>
            </div>
        </div>

        <video id="video-preview" autoplay playsinline muted></video>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nosleep.js@0.12.1/dist/NoSleep.min.js"></script>
    <script>
        const socket = io({
            transports: ['websocket', 'polling'],
            reconnectionAttempts: 10,
            timeout: 10000
        });
        
        const statusEl = document.getElementById('connection-status');
        const frameCounterEl = document.querySelector('.frame-counter');
        const errorEl = document.getElementById('error-message');
        const errorTextEl = document.getElementById('error-text');
        const retryButton = document.getElementById('retry-button');
        const videoPreview = document.getElementById('video-preview');
        
        let frameCount = 0;
        let localStream = null;
        let canvas = null;
        let ctx = null;
        let isStreaming = false;
        let lastFrameTime = 0;
        let targetFps = 60; // 60 FPS target
        let frameInterval = 16.6; // ~60 FPS interval in ms
        let fpsCounter = 0;
        let lastFpsTime = performance.now();
        let currentFps = 0;
        let droppedFrames = 0;

        // Network quality monitoring
        let currentPing = 0;
        pingHistory = [];
        let currentQuality = 0.70; // Optimized default quality for sub-50ms latency
        let resolutionLabel = '720p';
        let packetLossRate = 0;
        let acknowledgedFrames = 0;
        let totalFramesSent = 0;

        // Client-side latency tracking
        let captureTimestamp = 0;
        let transmitTimestamp = 0;
        let endToEndLatency = 0;

        let noSleep = null;
        try {
            if (typeof NoSleep !== 'undefined') {
                noSleep = new NoSleep();
            }
        } catch (e) {
            console.warn('NoSleep init skipped:', e);
        }
        let silentAudio = null;

        // Camera controls
        let currentFacingMode = 'user'; // 'user' = front, 'environment' = rear
        let currentResolution = 720; // Default resolution
        let torchEnabled = false;
        let isMirrored = false;
        let imageCapture = null;
        
        socket.on('connect', () => {
            console.log('Socket connected successfully');
            statusEl.textContent = 'Connected to Server';
            statusEl.className = 'status connected';
        });

        socket.on('connect_error', (err) => {
            console.error('Socket connect error:', err);
            statusEl.textContent = 'Connecting...';
            statusEl.className = 'status disconnected';
        });
        
        socket.on('disconnect', () => {
            statusEl.textContent = 'Disconnected';
            statusEl.className = 'status disconnected';
        });

        socket.on('ping_response', (data) => {
            const rtt = performance.now() - data.timestamp;
            pingHistory.push(rtt);
            if (pingHistory.length > 10) {
                pingHistory.shift();
            }
            currentPing = pingHistory.reduce((a, b) => a + b) / pingHistory.length;
            updateNetworkStatus();
        });

        socket.on('frame_ack', () => {
            acknowledgedFrames++;
            if (totalFramesSent > 0) {
                packetLossRate = 1 - (acknowledgedFrames / totalFramesSent);
            }
            updateNetworkStatus();
        });

        socket.on('telemetry', (data) => {
            const telemetryInfo = ` | Server FPS: ${data.fps} | BW: ${data.bandwidth.toFixed(1)} Mbps`;
            frameCounterEl.textContent = `Frames: ${frameCount} | FPS: ${currentFps} | Dropped: ${droppedFrames}${telemetryInfo}`;
        });
        
        function showError(message) {
            errorTextEl.textContent = message;
            errorEl.style.display = 'block';
        }
        
        function hideError() {
            errorEl.style.display = 'none';
        }
        
        function updateFrameCounter() {
            frameCounterEl.textContent = `Frames: ${frameCount} | FPS: ${currentFps} | Dropped: ${droppedFrames}`;
        }

        function updateNetworkStatus() {
            if (currentPing < 50) {
                currentQuality = 0.75;
            } else if (currentPing < 100) {
                currentQuality = 0.68;
            } else if (currentPing < 200) {
                currentQuality = 0.58;
            } else {
                currentQuality = 0.50;
            }
        }

        function measurePing() {
            if (!isStreaming) return;
            socket.emit('ping', { timestamp: performance.now() });
        }

        setInterval(measurePing, 5000);

        function playSilentAudio() {
            try {
                if (!silentAudio) {
                    silentAudio = document.createElement('audio');
                    silentAudio.loop = true;
                    silentAudio.src = 'data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBIAAAABAAEAQB8AAEAfAAABAAgAAABmYWN0BAAAAAAAAABkYXRhAAAAAA==';
                    silentAudio.volume = 0;
                    silentAudio.play().catch(e => console.log('Silent audio play failed:', e));
                }
            } catch (e) {}
        }

        function stopSilentAudio() {
            if (silentAudio) {
                silentAudio.pause();
                silentAudio = null;
            }
        }

        function stopStreaming() {
            isStreaming = false;
            if (noSleep) noSleep.disable();
            stopSilentAudio();
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
        }
        
        function debugLog(msg) {
            console.log(msg);
            const d = document.getElementById('debug-log');
            if (d) {
                d.style.display = 'block';
                d.textContent = msg;
            }
        }

        async function startCamera() {
            debugLog('Button tapped. Checking mediaDevices...');
            const startBtn = document.getElementById('start-btn');
            if (startBtn) {
                startBtn.textContent = 'Requesting Camera Access...';
                startBtn.style.background = '#007bff';
            }
            hideError();

            try {
                // Check for secure context first
                if (!window.isSecureContext) {
                    throw new Error(
                        '⚠️ Camera access requires a secure connection!\n\n' +
                        'You opened this page over HTTP, but iOS requires HTTPS for camera access.\n\n' +
                        '✅ Fix: Use the HTTPS link shown in the terminal:\n' +
                        '  - It should start with https:// (not http://)\n' +
                        '  - On first visit, tap "Show Details" → "visit this website"\n' +
                        '  - For iOS: Follow the certificate trust steps shown in terminal'
                    );
                }

                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error(
                        '⚠️ Camera API not available!\n\n' +
                        'Your browser does not support camera access.\n\n' +
                        '✅ Fix: Use a modern browser (Safari on iOS, Chrome/Firefox on desktop)'
                    );
                }

                debugLog('Opening camera prompt...');
                // Request camera stream with standard iOS fallback
                let stream = null;
                const resolutions = {
                    480: { width: 640, height: 480 },
                    720: { width: 1280, height: 720 },
                    1080: { width: 1920, height: 1080 }
                };
                const res = resolutions[currentResolution] || { width: 1280, height: 720 };

                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            width: { ideal: res.width },
                            height: { ideal: res.height },
                            frameRate: { ideal: targetFps, min: 30 },
                            facingMode: currentFacingMode
                        },
                        audio: false
                    });
                    debugLog(`Camera stream acquired at ${targetFps} FPS target.`);
                } catch (firstErr) {
                    debugLog('Retrying with basic video constraint...');
                    // Fallback to minimal video constraint for older iOS Safari
                    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    debugLog('Camera stream acquired with fallback.');
                }

                localStream = stream;
                videoPreview.setAttribute('playsinline', '');
                videoPreview.setAttribute('webkit-playsinline', '');
                videoPreview.muted = true;
                videoPreview.srcObject = localStream;

                try {
                    await videoPreview.play();
                } catch (playErr) {
                    console.warn('Autoplay caught:', playErr);
                }

                const videoTrack = localStream.getVideoTracks()[0];
                if ('ImageCapture' in window) {
                    try {
                        imageCapture = new ImageCapture(videoTrack);
                    } catch (e) {}
                }

                canvas = document.createElement('canvas');
                canvas.width = res.width;
                canvas.height = res.height;
                ctx = canvas.getContext('2d');

                isStreaming = true;
                hideError();

                if (startBtn) startBtn.style.display = 'none';
                document.getElementById('control-panel').style.display = 'block';

                updateCameraToggleButton();
                updateTorchButtonState();

                if (noSleep) {
                    try { noSleep.enable(); } catch (e) {}
                }
                playSilentAudio();

                extractFrames();

            } catch (error) {
                console.error('Camera access error:', error);
                
                // Update status banner with specific error
                if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
                    statusEl.textContent = 'Camera permission denied. Please allow camera access and reload.';
                    statusEl.className = 'status error';
                } else if (error.name === 'NotFoundError') {
                    statusEl.textContent = 'No camera found on this device.';
                    statusEl.className = 'status error';
                } else if (error.name === 'NotReadableError') {
                    statusEl.textContent = 'Camera is already in use by another application.';
                    statusEl.className = 'status error';
                } else {
                    statusEl.textContent = `Camera error: ${error.message || error}`;
                    statusEl.className = 'status error';
                }
                
                if (startBtn) {
                    startBtn.style.display = 'block';
                    startBtn.textContent = '❌ Tap to Retry Camera';
                    startBtn.style.background = '#dc3545';
                }
                showError(`Camera Error: ${error.name || ''} - ${error.message || error}`);
            }
        }

        async function switchCamera() {
            // Stop current stream
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            // Toggle facing mode
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';

            // Restart camera with new facing mode
            await startCamera();
        }

        function updateCameraToggleButton() {
            const button = document.getElementById('camera-toggle');
            button.textContent = currentFacingMode === 'user' ? '📷 Switch to Rear' : '📷 Switch to Front';
        }

        function updateTorchButtonState() {
            const button = document.getElementById('torch-toggle');
            // Torch only works on rear camera
            button.disabled = currentFacingMode !== 'environment';
            button.textContent = torchEnabled ? '🔦 Flashlight ON' : '🔦 Flashlight OFF';
            button.style.background = torchEnabled ? '#FF5722' : '#FF9800';
        }

        async function toggleTorch() {
            if (!imageCapture) {
                showError('Torch not supported on this device');
                return;
            }

            try {
                torchEnabled = !torchEnabled;

                // Try WebKit ImageCapture API first (iOS)
                if (imageCapture.applyConstraints) {
                    await imageCapture.applyConstraints({
                        advanced: [{ torch: torchEnabled }]
                    });
                }
                // Fallback to direct constraint
                else if (localStream.getVideoTracks()[0].applyConstraints) {
                    await localStream.getVideoTracks()[0].applyConstraints({
                        advanced: [{ torch: torchEnabled }]
                    });
                } else {
                    throw new Error('Torch API not supported');
                }

                updateTorchButtonState();
            } catch (error) {
                console.error('Torch toggle error:', error);
                torchEnabled = !torchEnabled; // Revert
                showError('Torch not supported on this device');
                updateTorchButtonState();
            }
        }
        
        function extractFrames() {
            if (!isStreaming || !localStream || !canvas || !ctx) {
                return;
            }

            function captureFrame(currentTime) {
                if (!isStreaming) {
                    return;
                }

                requestAnimationFrame(captureFrame);

                // Calculate delta time for frame rate control
                const delta = currentTime - lastFrameTime;

                // Calculate FPS every second
                fpsCounter++;
                if (currentTime - lastFpsTime >= 1000) {
                    currentFps = fpsCounter;
                    fpsCounter = 0;
                    lastFpsTime = currentTime;
                    updateFrameCounter();
                }

                // Skip frame if too soon (throttling)
                if (delta < frameInterval) {
                    return;
                }

                // Skip frame if way too late (burst handling)
                if (delta > frameInterval * 2) {
                    droppedFrames++;
                    lastFrameTime = currentTime;
                    return;
                }

                // Jitter compensation: adjust timing to maintain smooth 30 FPS
                lastFrameTime = currentTime - (delta % frameInterval);

                // Capture timestamp for latency tracking
                captureTimestamp = performance.now();

                // Draw video frame to canvas (handle mirroring)
                ctx.save();
                if (isMirrored) {
                    ctx.translate(canvas.width, 0);
                    ctx.scale(-1, 1);
                }
                ctx.drawImage(videoPreview, 0, 0, canvas.width, canvas.height);
                ctx.restore();

                // Convert to JPEG blob with dynamic quality
                canvas.toBlob((blob) => {
                    if (blob && isStreaming) {
                        // Track transmit timestamp
                        transmitTimestamp = performance.now();
                        // Calculate capture latency
                        const captureLatency = transmitTimestamp - captureTimestamp;

                        // Transmit binary frame via WebSocket with timestamp
                        socket.emit('video_frame', blob);
                        totalFramesSent++;
                        frameCount++;
                    }
                }, 'image/jpeg', currentQuality);
            }

            requestAnimationFrame(captureFrame);
        }
        
        // Initialize on page load
        window.addEventListener('load', () => {
            const isSecure = window.isSecureContext || window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const infoMessage = document.getElementById('info-message');
            if (!isSecure) {
                infoMessage.style.display = 'block';
            }
        });
        
        const startBtn = document.getElementById('start-btn');
        if (startBtn) {
            startBtn.addEventListener('click', () => {
                startCamera();
            });
            startBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                startCamera();
            }, { passive: false });
        }

        retryButton.addEventListener('click', () => {
            if (localStream) {
                // Stop existing stream
                localStream.getTracks().forEach(track => track.stop());
            }
            startCamera();
        });

        // Camera toggle button
        document.getElementById('camera-toggle').addEventListener('click', switchCamera);

        // Torch toggle button
        document.getElementById('torch-toggle').addEventListener('click', toggleTorch);

        // Mirror toggle button
        const mirrorBtn = document.getElementById('mirror-toggle');
        if (mirrorBtn) {
            mirrorBtn.addEventListener('click', () => {
                isMirrored = !isMirrored;
                mirrorBtn.style.background = isMirrored ? '#E91E63' : '#9C27B0';
                mirrorBtn.textContent = isMirrored ? '🪞 Mirrored ON' : '🪞 Flip / Mirror';
                // Also mirror phone preview for consistency
                videoPreview.style.transform = isMirrored ? 'scaleX(-1)' : 'none';
            });
        }

        // FPS selector (30 FPS / 60 FPS)
        const fpsSelector = document.getElementById('fps-selector');
        if (fpsSelector) {
            fpsSelector.addEventListener('change', async (e) => {
                targetFps = parseInt(e.target.value);
                frameInterval = 1000 / targetFps;
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                    localStream = null;
                }
                await startCamera();
            });
        }

        // Resolution selector
        document.getElementById('resolution-selector').addEventListener('change', async (e) => {
            currentResolution = parseInt(e.target.value);

            // Stop current stream
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            // Restart camera with new resolution
            await startCamera();
        });
        
        // Handle page visibility change (pause when hidden to save battery)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                noSleep.disable();
                stopSilentAudio();
            } else {
                if (isStreaming) {
                    noSleep.enable();
                    playSilentAudio();
                }
            }
        });
    </script>
</body>
</html>
